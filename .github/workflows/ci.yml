name: FinStat CI Pipeline

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main
      - 'phase-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-bootstrap:
    name: Environment Sanity Check (Bootstrap)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Verify Environment & Tools
        run: |
          node -v
          npm -v
          echo "FinStat CI Pipeline initialized successfully for ${{ github.ref }}"
