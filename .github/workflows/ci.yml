name: FinStat CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main
      - 'phase-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-and-lint:
    name: Syntax & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Validate Backend JavaScript Syntax
        run: |
          node -c backend/server.js
          node -c backend/config/db.js
          node -c backend/config/envValidator.js
          node -c backend/scripts/disable-all-2fa.js

  backend-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: syntax-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Integration Tests (In-Band)
        working-directory: backend
        run: npx jest --runInBand --detectOpenHandles
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long_for_security
          CRON_SECRET: test_cron_secret_min_16_chars
          ENCRYPTION_KEY: dGVzdF9lbmNyeXB0aW9uX2tleV8zMmJ5dGVzX2Jhc2U2NA==

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    needs: syntax-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application Bundle
        working-directory: frontend
        run: npm run build
        env:
          CI: true

  deploy-production:
    name: Deploy to Production (Vercel)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Deploy to Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
